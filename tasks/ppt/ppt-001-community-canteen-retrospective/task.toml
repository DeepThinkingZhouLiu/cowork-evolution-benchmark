schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-001-community-canteen-retrospective"
version = "0.1.0"
description = "社区食堂试点复盘汇报，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "material_to_deck", "公共服务"]

[metadata]
domain = "ppt"
task_family = "material_to_deck"
taxonomy_version = "v0.1"
operation_types = ["create", "analyze"]
input_modalities = ["document", "image", "multi_file", "spreadsheet"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "公共服务"
occupation = "项目运营经理"
deliverable_types = ["pptx"]
output_filenames = ["社区食堂试点复盘.pptx"]
capability_ids = ["K1", "K2", "K4", "K7", "K9"]
supplier_capability_ids = ["C1", "C2", "C4", "C10", "C11"]
difficulty_tier = "advanced"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 90
provenance_id = "synthetic/ppt-001-community-canteen-retrospective"
leakage_group_id = "ppt-family/material_to_deck/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
