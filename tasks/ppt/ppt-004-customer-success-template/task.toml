schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-004-customer-success-template"
version = "0.1.0"
description = "客户成功月报套模板生成，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "template_based_generation", "企业软件"]

[metadata]
domain = "ppt"
task_family = "template_based_generation"
taxonomy_version = "v0.1"
operation_types = ["create"]
input_modalities = ["multi_file", "presentation", "spreadsheet"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "企业软件"
occupation = "客户成功经理"
deliverable_types = ["pptx"]
output_filenames = ["青岚科技_7月客户成功月报.pptx"]
capability_ids = ["K2", "K4", "K6", "K7", "K10"]
supplier_capability_ids = ["C3", "C4", "C10"]
difficulty_tier = "advanced"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 90
provenance_id = "synthetic/ppt-004-customer-success-template"
leakage_group_id = "ppt-family/template_based_generation/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
