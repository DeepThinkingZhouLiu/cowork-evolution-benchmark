schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-005-renewal-review-revision"
version = "0.1.0"
description = "客户续约评审内容修订，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "content_editing", "企业服务"]

[metadata]
domain = "ppt"
task_family = "content_editing"
taxonomy_version = "v0.1"
operation_types = ["edit"]
input_modalities = ["multi_file", "presentation"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "企业服务"
occupation = "商务运营经理"
deliverable_types = ["pptx"]
output_filenames = ["Q3客户续约评审_已修订.pptx"]
capability_ids = ["K2", "K6", "K8", "K10"]
supplier_capability_ids = ["C3", "C10"]
difficulty_tier = "advanced"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 75
provenance_id = "synthetic/ppt-005-renewal-review-revision"
leakage_group_id = "ppt-family/content_editing/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
