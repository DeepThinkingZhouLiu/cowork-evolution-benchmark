schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-008-product-lines-consolidation"
version = "0.1.0"
description = "产品线经营稿合并，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "deck_consolidation", "智能硬件"]

[metadata]
domain = "ppt"
task_family = "deck_consolidation"
taxonomy_version = "v0.1"
operation_types = ["transform"]
input_modalities = ["multi_file", "presentation", "spreadsheet"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "智能硬件"
occupation = "产品运营总监"
deliverable_types = ["pptx"]
output_filenames = ["云纳智造_7月产品线联合经营报告.pptx"]
capability_ids = ["K2", "K4", "K6", "K8", "K10", "K13"]
supplier_capability_ids = ["C2", "C3", "C9", "C10"]
difficulty_tier = "expert"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 120
provenance_id = "synthetic/ppt-008-product-lines-consolidation"
leakage_group_id = "ppt-family/deck_consolidation/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
