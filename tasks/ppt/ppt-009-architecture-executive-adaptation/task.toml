schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-009-architecture-executive-adaptation"
version = "0.1.0"
description = "技术架构稿管理层改写，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "audience_adaptation", "互联网平台"]

[metadata]
