schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-011-volunteer-conference-package"
version = "0.1.0"
description = "志愿者大会演示交付包，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "presentation_package", "公益"]

[metadata]
domain = "ppt"
task_family = "presentation_package"
taxonomy_version = "v0.1"
operation_types = ["package"]
input_modalities = ["document", "image", "multi_file", "spreadsheet"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "公益"
occupation = "会务项目经理"
deliverable_types = ["pptx", "pdf", "docx"]
output_filenames = ["2026微光志愿者大会.pptx", "2026微光志愿者大会_参会手册.pdf", "2026微光志愿者大会_讲者手册.docx"]
capability_ids = ["K1", "K2", "K4", "K7", "K9", "K12"]
supplier_capability_ids = ["C6", "C10", "C12"]
difficulty_tier = "expert"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 120
provenance_id = "synthetic/ppt-011-volunteer-conference-package"
leakage_group_id = "ppt-family/presentation_package/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
