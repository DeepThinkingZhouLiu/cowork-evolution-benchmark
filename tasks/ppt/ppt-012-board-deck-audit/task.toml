schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/ppt-012-board-deck-audit"
version = "0.1.0"
description = "董事会经营简报审计与更正，公开合成端到端PPT任务。"
keywords = ["office", "ppt", "deck_audit", "新能源"]

[metadata]
domain = "ppt"
task_family = "deck_audit"
taxonomy_version = "v0.1"
operation_types = ["audit"]
input_modalities = ["multi_file", "presentation", "spreadsheet"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "layout_fidelity", "style_consistency", "professional_readiness"]
sector = "新能源"
occupation = "董事会办公室分析师"
deliverable_types = ["pptx"]
output_filenames = ["2026H1董事会经营简报_已核验.pptx"]
capability_ids = ["K2", "K4", "K6", "K8", "K11", "K13"]
supplier_capability_ids = ["C3", "C10"]
difficulty_tier = "expert"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 120
provenance_id = "synthetic/ppt-012-board-deck-audit"
leakage_group_id = "ppt-family/deck_audit/synthetic-v1"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "deterministic-pptx-v1"
