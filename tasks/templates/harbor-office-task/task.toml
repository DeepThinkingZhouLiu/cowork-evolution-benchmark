schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/template-office-task"
version = "0.1.0"
description = "Harbor Office 制题模板，不属于正式 Benchmark。"
keywords = ["office", "template"]

[metadata]
domain = "ppt"
task_family = "replace-with-task-family"
taxonomy_version = "v0.1"
operation_types = ["create"]
input_modalities = ["multi_file"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "professional_readiness"]
deliverable_types = ["pptx"]
output_filenames = ["replace-with-output.pptx"]
capability_ids = ["K1", "K6", "K8"]
supplier_capability_ids = ["C2", "C4", "C10"]
sector = "replace-with-sector"
occupation = "replace-with-occupation"
difficulty_tier = "intermediate"
multimodal = true
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic", "visual"]
estimated_minutes = 60
provenance_id = "template"
leakage_group_id = "template"
publishability = "prohibited"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 1800.0

[verifier.env]
JUDGE_MODEL = "${JUDGE_MODEL:-fixed-judge-placeholder}"
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_PER_TIMEOUT = "${JUDGE_PER_TIMEOUT:-360}"
JUDGE_CONCURRENCY = "${JUDGE_CONCURRENCY:-4}"
JUDGE_MAX_TRIES = "${JUDGE_MAX_TRIES:-5}"
