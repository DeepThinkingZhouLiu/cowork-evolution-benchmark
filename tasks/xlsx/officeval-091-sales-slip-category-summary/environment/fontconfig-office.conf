<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Micro Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Micro Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
</fontconfig>
