schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/xlsx-data-cleaning-crm-leads"
version = "0.1.0"
description = "清洗并去重 CRM 客户线索"
keywords = ["office", "xlsx", "data_cleaning", "synthetic-public"]

[metadata]
domain = "xlsx"
task_family = "data_cleaning"
taxonomy_version = "v0.1"
operation_types = ["transform", "analyze"]
input_modalities = ["spreadsheet", "plain_text", "multi_file"]
dependency_scope = "multi_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "traceability"]
deliverable_types = ["xlsx"]
output_filenames = ["客户线索清洗结果.xlsx"]
capability_ids = ["K2", "K3", "K10", "K12"]
supplier_capability_ids = ["C2", "C10", "C12"]
sector = "企业服务"
occupation = "CRM 运营专员"
difficulty_tier = "intermediate"
multimodal = false
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 50
provenance_id = "xlsx-data-cleaning-crm-leads-synthetic-v1"
leakage_group_id = "public-synthetic-data_cleaning-001"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 600.0

[verifier.env]
PYTHONUNBUFFERED = "1"
