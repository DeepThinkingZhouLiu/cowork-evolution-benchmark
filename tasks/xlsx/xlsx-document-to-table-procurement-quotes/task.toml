schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/xlsx-document-to-table-procurement-quotes"
version = "0.1.0"
description = "从供应商报价纪要生成采购比价表"
keywords = ["office", "xlsx", "document_to_table", "synthetic-public"]

[metadata]
domain = "xlsx"
task_family = "document_to_table"
taxonomy_version = "v0.1"
operation_types = ["transform", "analyze"]
input_modalities = ["document"]
dependency_scope = "single_file"
constraint_profiles = ["content_fidelity", "numeric_accuracy", "traceability", "professional_readiness"]
deliverable_types = ["xlsx"]
output_filenames = ["采购报价结构化.xlsx"]
capability_ids = ["K1", "K2", "K3", "K6"]
supplier_capability_ids = ["C2", "C7", "C9", "C10", "C12"]
sector = "企业采购"
occupation = "采购专员"
difficulty_tier = "intermediate"
multimodal = false
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 45
provenance_id = "xlsx-document-to-table-procurement-quotes-synthetic-v1"
leakage_group_id = "public-synthetic-document_to_table-001"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 600.0

[verifier.env]
PYTHONUNBUFFERED = "1"
