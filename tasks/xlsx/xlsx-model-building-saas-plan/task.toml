schema_version = "1.4"
artifacts = ["/app/output", "/logs/artifacts/output"]

[task]
name = "cowork-evo/xlsx-model-building-saas-plan"
version = "0.1.0"
description = "搭建 SaaS 三年经营模型"
keywords = ["office", "xlsx", "model_building", "synthetic-public"]

[metadata]
domain = "xlsx"
task_family = "model_building"
taxonomy_version = "v0.1"
operation_types = ["create", "analyze"]
input_modalities = ["spreadsheet"]
dependency_scope = "single_file"
constraint_profiles = ["numeric_accuracy", "formula_correctness", "traceability", "professional_readiness"]
deliverable_types = ["xlsx"]
output_filenames = ["SaaS三年经营模型.xlsx"]
capability_ids = ["K2", "K4", "K5", "K8"]
supplier_capability_ids = ["C8", "C10"]
sector = "SaaS"
occupation = "FP&A 分析师"
difficulty_tier = "advanced"
multimodal = false
web_search_required = false
language = "zh-CN"
judge_types = ["deterministic"]
estimated_minutes = 90
provenance_id = "xlsx-model-building-saas-plan-synthetic-v1"
leakage_group_id = "public-synthetic-model_building-001"
publishability = "public"

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1800.0
cpus = 2
memory_mb = 4096
storage_mb = 12288
gpus = 0
allow_internet = false
mcp_servers = []
workdir = "/app"

[verifier]
timeout_sec = 600.0

[verifier.env]
PYTHONUNBUFFERED = "1"
